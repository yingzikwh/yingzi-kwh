<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>影子kwh - AI Coding Agent</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 30%, #4a1942 60%, #6b2d3a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 182, 193, 0.6);
      border-radius: 50%;
      animation: float 6s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
    }

    /* Main container */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 900px;
      padding: 2rem;
    }

    /* Cover image */
    .cover-frame {
      position: relative;
      display: inline-block;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(255, 105, 180, 0.3),
        0 0 80px rgba(255, 182, 193, 0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .cover-frame:hover {
      transform: translateY(-5px);
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.6),
        0 0 50px rgba(255, 105, 180, 0.4),
        0 0 100px rgba(255, 182, 193, 0.2);
    }

    .cover-frame img {
      display: block;
      width: 100%;
      max-width: 520px;
      height: auto;
      border-radius: 20px;
    }

    /* Glow border animation */
    .cover-frame::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 23px;
      background: linear-gradient(45deg, #ff69b4, #ffa07a, #ff69b4, #da70d6);
      background-size: 400% 400%;
      z-index: -1;
      animation: glowRotate 3s linear infinite;
    }

    @keyframes glowRotate {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Title */
    .title {
      margin-top: 2.5rem;
      font-size: 3.5rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 105, 180, 0.5), 0 0 40px rgba(255, 182, 193, 0.3);
      letter-spacing: 0.15em;
    }

    .subtitle {
      margin-top: 0.8rem;
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 300;
      letter-spacing: 0.1em;
    }

    .version-badge {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.3rem 1rem;
      background: rgba(255, 105, 180, 0.2);
      border: 1px solid rgba(255, 105, 180, 0.4);
      border-radius: 20px;
      color: #ff69b4;
      font-size: 0.85rem;
      font-weight: 400;
    }

    /* Feature tags */
    .features {
      margin-top: 1.5rem;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .feature-tag {
      padding: 0.35rem 0.9rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 15px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }

    .feature-tag:hover {
      background: rgba(255, 105, 180, 0.15);
      border-color: rgba(255, 105, 180, 0.3);
      color: #ffb6c1;
    }

    /* Launch button */
    .launch-btn {
      margin-top: 2.5rem;
      padding: 1rem 3.5rem;
      font-size: 1.2rem;
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ff69b4, #da70d6);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 105, 180, 0.4);
      transition: all 0.3s ease;
      letter-spacing: 0.1em;
      position: relative;
      overflow: hidden;
    }

    .launch-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s ease;
    }

    .launch-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(255, 105, 180, 0.5);
    }

    .launch-btn:hover::before {
      left: 100%;
    }

    .launch-btn:active {
      transform: translateY(0);
    }

    /* Footer */
    .footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.75rem;
      z-index: 1;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .title { font-size: 2.2rem; }
      .subtitle { font-size: 0.9rem; }
      .cover-frame img { max-width: 320px; }
      .launch-btn { padding: 0.8rem 2.5rem; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <div class="container">
    <div class="cover-frame">
      <img src="/assets/cover.jpg" alt="影子kwh Cover">
    </div>

    <h1 class="title">影子kwh</h1>
    <p class="subtitle">AI 编程智能体 &middot; 代码助手 &middot; 终端伙伴</p>
    <span class="version-badge">v1.0.0</span>

    <div class="features">
      <span class="feature-tag">代码 Diff</span>
      <span class="feature-tag">Git 集成</span>
      <span class="feature-tag">语法高亮</span>
      <span class="feature-tag">自主规划</span>
      <span class="feature-tag">代码索引</span>
    </div>

    <button class="launch-btn" onclick="launch()">
      &#9654; 启动终端
    </button>
  </div>

  <div class="footer">
    Powered by DeepSeek / Qwen / OpenAI &middot; 基于 Claude Code 架构灵感
  </div>

  <script>
    // Create floating particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDelay = Math.random() * 6 + 's';
      p.style.animationDuration = (4 + Math.random() * 4) + 's';
      p.style.width = (2 + Math.random() * 4) + 'px';
      p.style.height = p.style.width;
      particlesContainer.appendChild(p);
    }

    function launch() {
      window.location.href = '/terminal.html';
    }
  </script>
</body>
</html>
